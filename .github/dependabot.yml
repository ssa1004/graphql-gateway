# Dependabot — 의존성 / GitHub Actions 업데이트 PR 자동 생성.
#
# gradle: 멀티모듈 빌드라도 directory "/" 하나로 루트 build.gradle.kts + 각 모듈
#   build.gradle.kts + gradle-wrapper 까지 한 번에 스캔된다 (version catalog 는 미사용).
# github-actions: ci.yml / codeql.yml 의 actions/* 핀 버전을 갱신.
#
# 주기는 monthly — patch 가 매주 쏟아져 PR noise 가 되지 않게.
# 각 ecosystem 은 groups 로 모든 업데이트를 PR 하나에 묶는다 (patterns "*"). 한 번에 열리는 PR 수도 제한.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # gradle 의존성 전체를 grouped PR 하나로 모은다 (Spring BOM / Kotlin 등 함께 움직임).
      gradle-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # github-actions 핀 버전 전체를 grouped PR 하나로 모은다.
      github-actions-all:
        patterns:
          - "*"

  # docker: 루트 Dockerfile 의 base 이미지(eclipse-temurin) 태그 갱신을 추적.
  #   런타임 OS/JRE CVE 패치가 새 base 태그로 나오면 PR 로 올라온다.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # docker base 이미지 업데이트 전체를 grouped PR 하나로 모은다.
      docker-all:
        patterns:
          - "*"
