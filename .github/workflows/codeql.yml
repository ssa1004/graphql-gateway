name: CodeQL

# Kotlin SAST. 이 레포는 100% Kotlin — language 는 java-kotlin 으로 분석한다
# (CodeQL 은 Kotlin 을 java-kotlin 추출기로 함께 다룬다).
#
# main 으로의 push / PR 마다 SAST 를 돌리고, 주 1회 스케줄로 정기 스캔도 유지한다.
# 필요 시 workflow_dispatch 로 즉시 실행한다.
on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 03:00 UTC — dependabot weekly 와 같은 날.
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # CodeQL 결과를 Security 탭에 업로드하기 위한 최소 권한.
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # Gradle 멀티모듈이라 자동 빌드 추론이 불안정 — 명시 빌드 단계를 둔다.
          build-mode: manual

      - name: Build
        run: ./gradlew compileKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
