name: CodeQL

# Kotlin SAST. 이 레포는 100% Kotlin — language 는 java-kotlin 으로 분석한다
# (CodeQL 은 Kotlin 을 java-kotlin 추출기로 함께 다룬다).
#
# main 으로의 push / PR 마다 SAST 를 돌리고, 주 1회 스케줄로 정기 스캔도 유지한다.
# 필요 시 workflow_dispatch 로 즉시 실행한다.
on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 03:00 UTC — dependabot weekly 와 같은 날.
    - cron: '0 3 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 ref 의 이전 분석은 취소 — 연속 push 시 큐가 쌓이지 않게.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # CodeQL 결과를 Security 탭에 업로드하기 위한 최소 권한.
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with: { distribution: temurin, java-version: '21', cache: gradle }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          languages: java-kotlin
          # Gradle 멀티모듈이라 자동 빌드 추론이 불안정 — 명시 빌드 단계를 둔다.
          build-mode: manual

      - name: Build
        # CodeQL 트레이서가 실제 컴파일을 관찰해야 소스가 추출된다. build-cache /
        # incremental 이 걸리면 compileKotlin 이 FROM-CACHE 로 떠서 "no source code
        # seen during build" 로 실패한다 → 캐시/데몬을 끄고 강제 재컴파일한다.
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks clean compileKotlin compileJava

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          category: "/language:java-kotlin"
