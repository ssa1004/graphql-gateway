name: CI

# main 으로의 push / PR 마다 자동 검증한다. 수동 실행도 workflow_dispatch 로 가능.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 ref 의 이전 실행은 취소 — PR 에 연속 push 시 큐가 쌓이지 않게.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 기본값. SARIF 업로드 등 추가 권한은 해당 job 에서만 올린다.
permissions:
  contents: read

jobs:
  build:
    name: Build + 전체 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with: { distribution: temurin, java-version: '21', cache: gradle }
      # 전체 테스트 — downstream 9 service 는 WireMock / stub 어댑터로 대체되므로
      # 외부 인프라 없이 자족적으로 돈다.
      - name: gradle check
        run: ./gradlew check --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

      # 커버리지 — 5개 모듈을 한 리포트로 병합 (Kover). check 가 만든 테스트 데이터를 재사용.
      - name: Kover coverage 리포트 (병합)
        run: ./gradlew koverXmlReport koverHtmlReport --no-daemon
      # 병합 XML(JaCoCo 스키마와 동일)에서 line coverage 를 계산해 job summary 와
      # shields.io endpoint 배지용 JSON 을 만든다. 외부 액션 없이 자족적으로 — 숫자는
      # 실제 테스트 실행 결과에서만 나온다 (날조 없음).
      - name: 커버리지 계산 + 배지 endpoint JSON
        if: always()
        run: |
          python3 - <<'PY'
          import os, glob, xml.etree.ElementTree as ET
          xmls = glob.glob('build/reports/kover/report.xml')
          if not xmls:
              raise SystemExit('Kover XML report not found')
          root = ET.parse(xmls[0]).getroot()
          # 최상위 <counter type="LINE" .../> 가 전체 합계(JaCoCo/Kover 공통 스키마).
          line = next(c for c in root.findall('counter') if c.get('type') == 'LINE')
          covered = int(line.get('covered')); missed = int(line.get('missed'))
          total = covered + missed
          pct = round(100.0 * covered / total, 1) if total else 0.0
          color = 'brightgreen' if pct >= 80 else 'green' if pct >= 70 else 'yellowgreen' if pct >= 60 else 'yellow' if pct >= 50 else 'orange' if pct >= 40 else 'red'
          os.makedirs('build/reports/kover/badges', exist_ok=True)
          import json
          with open('build/reports/kover/badges/coverage.json', 'w') as f:
              json.dump({'schemaVersion': 1, 'label': 'coverage', 'message': f'{pct}%', 'color': color}, f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write('### Coverage (Kover, 5-module merged)\n')
              s.write(f'- line coverage: **{pct}%** ({covered}/{total} lines)\n')
          print(f'line coverage: {pct}% ({covered}/{total})')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: |
            build/reports/kover/html/**
            build/reports/kover/report.xml
            build/reports/kover/badges/**

  static-analysis:
    name: Static analysis (Kotlin 컴파일)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: ./gradlew compileKotlin compileTestKotlin --no-daemon

  helm-lint:
    name: Helm chart lint + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: 'v3.16.2' }
      - run: helm lint helm/graphql-gateway
      - name: Helm template 렌더 검증
        run: |
          helm template gw helm/graphql-gateway > /dev/null
          helm template gw helm/graphql-gateway -f helm/graphql-gateway/values-prod.yaml > /dev/null
      # 렌더된 매니페스트를 k8s OpenAPI 스키마로 검증 — 잘못된 필드/타입을 lint 가
      # 못 잡는 부분까지 막는다. CRD(ServiceMonitor 등) 는 missing-schema 로 skip.
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: kubeconform (default + prod values)
        run: |
          check() {
            helm template gw helm/graphql-gateway "$@" \
              | kubeconform -strict -ignore-missing-schemas -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          }
          check
          check -f helm/graphql-gateway/values-prod.yaml

  image:
    name: Docker image build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # Trivy SARIF 결과를 Security 탭(code scanning) 에 업로드하기 위한 권한.
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Build bootJar
        run: ./gradlew :gateway-bootstrap:bootJar --no-daemon
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        run: docker build -t graphql-gateway:${{ github.sha }} .
      # SARIF 리포트 — 결과를 Security 탭에 누적해 시간순 추적이 가능하게 한다.
      # @master 같은 mutable ref 는 공급망 취약점 — SHA 로 고정.
      - name: Trivy scan (SARIF 리포트)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: graphql-gateway:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        # 업로드 실패(권한/포크 PR 등) 가 빌드 전체를 깨지 않게 — 게이팅은 아래 scan 이 한다.
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
      # CRITICAL/HIGH 발견 시 빌드를 실패시키는 게이팅 스캔 — 리포트와 분리해 둔다.
      - name: Trivy scan (게이팅, fixable CRITICAL/HIGH 차단)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: graphql-gateway:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
