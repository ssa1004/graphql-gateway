name: CI

# push / PR trigger 는 현재 수동 검증용으로 비활성화했다.
# 자동 검증이 필요하면 아래 push / pull_request 블록을 활성화한다.
on:
  workflow_dispatch:
  # push:    { branches: [main] }
  # pull_request:
  #   branches: [main]

jobs:
  build:
    name: Build + 전체 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      # 전체 테스트 — downstream 9 service 는 WireMock / stub 어댑터로 대체되므로
      # 외부 인프라 없이 자족적으로 돈다.
      - name: gradle check
        run: ./gradlew check --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  static-analysis:
    name: Static analysis (Kotlin 컴파일)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: ./gradlew compileKotlin compileTestKotlin --no-daemon

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: 'v3.16.2' }
      - run: helm lint helm/graphql-gateway
      - name: Helm template 렌더 검증
        run: |
          helm template gw helm/graphql-gateway > /dev/null
          helm template gw helm/graphql-gateway -f helm/graphql-gateway/values-prod.yaml > /dev/null

  image:
    name: Docker image build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Build bootJar
        run: ./gradlew :gateway-bootstrap:bootJar --no-daemon
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t graphql-gateway:${{ github.sha }} .
      - name: Trivy scan
        # @master 같은 mutable ref 는 공급망 취약점 — tag 로 고정.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: graphql-gateway:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
