# 운영 (prod) 오버라이드.
#   helm upgrade --install graphql-gateway ./helm/graphql-gateway \
#     -n portfolio -f helm/graphql-gateway/values-prod.yaml
#
# 게이트웨이는 상태가 없어 비밀 값이 없다 — JWT 는 auth-service 의 공개 JWK Set 으로
# 검증하므로 chart 가 secret 을 만들지 않는다.

springProfile: prod

replicaCount: 3

# ----------------------------------------------------------------------------
# Ingress + TLS
# ----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager 로 LE 발급. cert-manager 가 없다면 이 줄 제거하고 secret 을 미리 만든다.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: graphql-gateway.example.com
      paths:
        - path: /graphql
          pathType: Prefix
  tls:
    - secretName: graphql-gateway-tls
      hosts:
        - graphql-gateway.example.com

# ----------------------------------------------------------------------------
# HPA + PDB
# ----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

# ----------------------------------------------------------------------------
# NetworkPolicy — 운영에서는 켠다.
# ----------------------------------------------------------------------------
networkPolicy:
  enabled: true

# 운영은 실제 downstream 을 호출 — stub 끔, 인증 켬.
downstream:
  stub: false

auth:
  permitAll: false
