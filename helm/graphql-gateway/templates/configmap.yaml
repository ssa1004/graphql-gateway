apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graphql-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graphql-gateway.labels" . | nindent 4 }}
data:
  # application.yml 의 ${...} 환경변수 자리를 채운다.
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfile | quote }}
  # downstream 9 service endpoint
  DOWNSTREAM_STUB: {{ .Values.downstream.stub | quote }}
  DOWNSTREAM_TIMEOUT_MS: {{ .Values.downstream.timeoutMs | quote }}
  AUTH_BASE_URL: {{ .Values.downstream.services.auth | quote }}
  COMMERCE_BASE_URL: {{ .Values.downstream.services.commerce | quote }}
  MARKETPLACE_BASE_URL: {{ .Values.downstream.services.marketplace | quote }}
  BILLING_BASE_URL: {{ .Values.downstream.services.billing | quote }}
  GPU_BASE_URL: {{ .Values.downstream.services.gpu | quote }}
  NOTIFICATION_BASE_URL: {{ .Values.downstream.services.notification | quote }}
  FEED_BASE_URL: {{ .Values.downstream.services.feed | quote }}
  SEARCH_BASE_URL: {{ .Values.downstream.services.search | quote }}
  SECURITY_LOG_BASE_URL: {{ .Values.downstream.services.securityLog | quote }}
  # 인증 (auth-service JWK Set)
  AUTH_ISSUER_URI: {{ .Values.auth.issuerUri | quote }}
  AUTH_JWK_SET_URI: {{ .Values.auth.jwkSetUri | quote }}
  SECURITY_PERMIT_ALL: {{ .Values.auth.permitAll | quote }}
  # 쿼리 가드
  QUERY_MAX_DEPTH: {{ .Values.queryGuard.maxDepth | quote }}
  QUERY_MAX_COMPLEXITY: {{ .Values.queryGuard.maxComplexity | quote }}
  # 관측
  OTLP_ENDPOINT: {{ .Values.otlp.tracingEndpoint | quote }}
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
