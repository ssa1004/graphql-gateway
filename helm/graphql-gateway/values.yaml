# graphql-gateway 기본 values. 운영 오버라이드는 values-prod.yaml 참고.
# 기본은 dev/local-cluster 상정 — replicas 1, ingress off, NetworkPolicy off.
#
# 이 게이트웨이는 상태가 없다(stateless) — DB/Redis/Kafka 를 쓰지 않는다. 외부 의존은
# 9개 downstream service 와 auth-service(JWK Set) 의 HTTP endpoint 뿐이다.

# ----------------------------------------------------------------------------
# 이미지
# ----------------------------------------------------------------------------
image:
  repository: ghcr.io/ssa1004/graphql-gateway
  # tag 가 비면 .Chart.AppVersion 사용
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# 워크로드
# ----------------------------------------------------------------------------
replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Spring 프로필. dev 는 demo(stub 어댑터 + 인증 off), prod 는 실제 downstream + JWT.
springProfile: dev

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# ----------------------------------------------------------------------------
# Graceful shutdown
# ----------------------------------------------------------------------------
# 게이트웨이는 상태가 없고, in-flight 요청은 downstream 호출을 기다리는 GraphQL 쿼리뿐이다.
# 종료 절차:
#   1) preStop sleep 으로 endpoint propagation 완료 대기 (~5s) — 새 요청이 안 들어오게.
#   2) Spring Boot graceful shutdown 으로 진행 중인 쿼리 정리.
#   3) terminationGracePeriodSeconds 안에 안 끝나면 SIGKILL.
# GraphQL 쿼리는 길어야 downstream 타임아웃(수 초) 안에 끝나므로 30s 면 충분하다.
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

# ----------------------------------------------------------------------------
# Probes
# ----------------------------------------------------------------------------
# Spring Boot cold start 가 길어 liveness 가 먼저 fail 하면서 무한 재시작에 빠지는 시나리오를
# startup probe 로 차단. startup 이 성공한 뒤에야 liveness/readiness 가 동작.
probes:
  startup:
    enabled: true
    path: /actuator/health/liveness
    failureThreshold: 30  # 30 × 2s = 60s 부팅 허용
    periodSeconds: 2
    timeoutSeconds: 3
  liveness:
    enabled: true
    path: /actuator/health/liveness
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    path: /actuator/health/readiness
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# ----------------------------------------------------------------------------
# Pod / 컨테이너 보안 컨텍스트
# ----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  # AWS IRSA — IAM Role for ServiceAccount. EKS 외 환경에서는 비워둔다.
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ----------------------------------------------------------------------------
# Service
# ----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Pod metric scrape 어노테이션 — Prometheus 가 직접 scrape 하는 환경 대비.
# ServiceMonitor 를 쓰는 환경에서는 무시돼도 무해.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# ----------------------------------------------------------------------------
# Ingress
# ----------------------------------------------------------------------------
# 게이트웨이가 외부에 노출하는 path:
#   /graphql   — GraphQL endpoint (POST)
#   /graphiql  — 개발용 playground UI (운영에서는 비활성 권장)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: graphql-gateway.example.com
      paths:
        - path: /graphql
          pathType: Prefix
  tls: []

# ----------------------------------------------------------------------------
# Autoscaling
# ----------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ----------------------------------------------------------------------------
# PodDisruptionBudget
# ----------------------------------------------------------------------------
pdb:
  enabled: false
  minAvailable: 1
  # maxUnavailable 는 minAvailable 와 상호배타. 둘 중 하나만 사용.

# ----------------------------------------------------------------------------
# NetworkPolicy
# ----------------------------------------------------------------------------
# 게이트웨이는 ingress controller 의 인바운드만 받고, 아웃바운드로 9개 downstream 과
# auth-service(JWK Set) 를 호출한다. 운영에서는 활성화 권장.
networkPolicy:
  enabled: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx

# ----------------------------------------------------------------------------
# downstream 9 service endpoint — 게이트웨이가 호출하는 대상.
# stub=true 면 게이트웨이가 in-memory stub 어댑터를 쓰고 아래 URL 은 무시된다.
# ----------------------------------------------------------------------------
downstream:
  # true 면 downstream 미가용 환경용 stub 어댑터 사용. 운영은 false.
  stub: false
  timeoutMs: 2000
  services:
    auth: http://auth-service.portfolio.svc.cluster.local:8080
    commerce: http://commerce-ops.portfolio.svc.cluster.local:8080
    marketplace: http://bid-ask-marketplace.portfolio.svc.cluster.local:8080
    billing: http://billing-platform.portfolio.svc.cluster.local:8080
    gpu: http://gpu-job-orchestrator.portfolio.svc.cluster.local:8080
    notification: http://notification-hub.portfolio.svc.cluster.local:8080
    feed: http://realtime-feed-service.portfolio.svc.cluster.local:8080
    search: http://search-service.portfolio.svc.cluster.local:8080
    securityLog: http://security-log-search.portfolio.svc.cluster.local:8080

# ----------------------------------------------------------------------------
# 인증 — auth-service 의 JWK Set 으로 JWT 검증 (ADR-0004)
# ----------------------------------------------------------------------------
auth:
  # OAuth2 resource server issuer. permitAll 이 true 면 무시된다.
  issuerUri: http://auth-service.portfolio.svc.cluster.local:8080/realms/portfolio
  jwkSetUri: http://auth-service.portfolio.svc.cluster.local:8080/realms/portfolio/protocol/openid-connect/certs
  # true 면 인증을 끈다 — 데모 전용. 운영에서는 false.
  permitAll: false

# ----------------------------------------------------------------------------
# 쿼리 가드 — GraphQL DoS 방어 (ADR-0008)
# ----------------------------------------------------------------------------
queryGuard:
  maxDepth: 15
  maxComplexity: 200

# ----------------------------------------------------------------------------
# 관측
# ----------------------------------------------------------------------------
otlp:
  # OpenTelemetry collector endpoint. 미설정이면 trace export 만 실패하고 앱은 정상.
  tracingEndpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces

# 추가 환경 변수 (자유 주입). configMap 으로 들어간다.
extraEnv: {}

# 추가 envFrom (이미 클러스터에 존재하는 secret/configmap 을 재사용할 때).
extraEnvFrom: []
